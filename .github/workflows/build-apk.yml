name: Build & Publish Notara APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Auto-Release Notara APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9 (dengan cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Baca versionName dari app/build.gradle.kts
        id: version
        run: |
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          echo "name=${VER:-5.0.0}" >> $GITHUB_OUTPUT

      - name: Build Optimized 60fps APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK menjadi Notara-v${{ steps.version.outputs.name }}.apk
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Notara-v${{ steps.version.outputs.name }}.apk"

      - name: Upload Artifact Cadangan
        uses: actions/upload-artifact@v4
        with:
          name: Notara-v${{ steps.version.outputs.name }}-APK
          path: dist/Notara-v${{ steps.version.outputs.name }}.apk
          retention-days: 30

      - name: Publish otomatis ke GitHub Releases (sinkron dengan Website Cloudflare Pages)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Notara v${{ steps.version.outputs.name }}
          make_latest: true
          files: dist/Notara-v${{ steps.version.outputs.name }}.apk
          generate_release_notes: true

name: Build Notara APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Notara-v5.0.0.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9 (dengan cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Optimized 60fps APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK menjadi Notara-v5.0.0.apk
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Notara-v5.0.0.apk

      - name: Upload Notara-v5.0.0.apk
        uses: actions/upload-artifact@v4
        with:
          name: Notara-v5.0.0-APK
          path: dist/Notara-v5.0.0.apk
          retention-days: 30

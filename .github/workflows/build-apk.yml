name: Build Notara APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Optimized 60fps APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9 (dengan cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Optimized Release APK (60fps)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload Notara 60fps APK
        uses: actions/upload-artifact@v4
        with:
          name: Notara-60fps-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
